name: Analyze Custom URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "머니올라 채널에 업로드된 유튜브 영상 URL"
        required: true
        type: string

run-name: "AnalyzeURL ${{ inputs.url }}"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies (optional)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Analyze URL
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          URL: ${{ inputs.url }}
          PYTHONPATH: src
        run: python -m radihola.cli analyze-url --url "$URL"

      - name: Commit and push results
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "radihola-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "data: shorts candidates for custom URL ($(date -u +%F))"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push failed, retrying after rebase (attempt $attempt)"
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            sleep $((attempt * 5))
          done
          echo "failed to push after retries" >&2
          exit 1
